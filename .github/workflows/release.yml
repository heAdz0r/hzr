name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: integrations/caveman-code/package-lock.json
      - name: Verify tag, baseline, and release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "hzr-cli"))')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git rev-parse --verify 'refs/tags/v0.1.0^{commit}' >/dev/null
          grep -F "HZR_VERSION=\"\${HZR_VERSION:-${version}}\"" install.sh >/dev/null
      - name: Run the complete source release gate
        run: scripts/complete-gate.sh
      - name: Enforce stable Latest release policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/release.yml").read_text()
          prerelease_flag = "--pre" + "release"
          if prerelease_flag in workflow:
              raise SystemExit("release workflow must not publish HZR tags as prereleases")
          if "--latest" not in workflow:
              raise SystemExit("release workflow must explicitly mark a stable tag Latest")
          PY
      - name: Audit the production Caveman dependency graph once
        run: npm audit --package-lock-only --omit=dev --omit=optional --audit-level=high --prefix integrations/caveman-code

  native-bundles:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            smoke_mode: full
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            smoke_mode: clean-only
          - runner: macos-15
            platform: darwin-arm64
            smoke_mode: clean-only
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Match the trusted cache warmer. Stable compiler coverage remains in ci.yml.
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.2
          # Managed Go sources are fetched by build-bundle.sh, so no repository-root
          # go.sum exists for setup-go's automatic dependency cache.
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Restore warmed release Cargo dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target/release
          key: hzr-release-rust-${{ matrix.platform }}-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            hzr-release-rust-${{ matrix.platform }}-1.92.0-
      - name: Restore verified component build cache
        uses: actions/cache/restore@v4
        with:
          path: target/hzr-component-cache
          key: hzr-components-${{ matrix.platform }}-${{ hashFiles('engines.lock.toml', 'patches/grepai/**', 'patches/icm/**', 'fork-core/CURRENT_ENGINE_V1.tsv', 'fork-core/rtk/Cargo.lock', 'scripts/build-bundle.sh') }}
          restore-keys: |
            hzr-components-${{ matrix.platform }}-
      - name: Build and smoke-test the self-contained bundle
        run: scripts/complete-gate.sh --bundle "$RUNNER_TEMP/hzr-dist"
      - name: Package native release archive
        run: scripts/package-release.sh "$RUNNER_TEMP/hzr-dist" "$RUNNER_TEMP/hzr-release"
      - name: Prove clean install without external engines
        shell: bash
        run: |
          set -euo pipefail
          scripts/smoke-install.sh \
            "$RUNNER_TEMP/hzr-release/hzr-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/hzr-release/SHA256SUMS" \
            "${{ matrix.smoke_mode }}"
      - uses: actions/upload-artifact@v6
        with:
          name: hzr-${{ matrix.platform }}
          path: ${{ runner.temp }}/hzr-release/hzr-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, native-bundles]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: hzr-*
          path: release-assets
          merge-multiple: true
      - name: Verify matrix and create aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = 3
          (cd release-assets && sha256sum *.tar.gz | LC_ALL=C sort > SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*.tar.gz
      # The published release must say what the repository says. `--generate-notes` produced a
      # commit list, so the GitHub Release and RELEASE_NOTES.md described the same version
      # differently and the release page carried no upgrade guidance at all.
      - name: Verify the release notes describe this tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          head -n 1 RELEASE_NOTES.md | grep -qF "HZR ${version}" || {
            echo "RELEASE_NOTES.md does not describe ${version}; its first line is:" >&2
            head -n 1 RELEASE_NOTES.md >&2
            exit 1
          }
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.tar.gz release-assets/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --latest
          --notes-file RELEASE_NOTES.md
          --title "HZR ${GITHUB_REF_NAME#v}"
