name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: scripts/complete-gate.sh

  assembled-bundle:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: complete-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Keep native component cache keys reproducible; the rust job below still tracks stable.
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.2
          # Managed Go sources are fetched by build-bundle.sh, so no repository-root
          # go.sum exists for setup-go's automatic dependency cache.
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-node@v5
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: integrations/caveman-code/package-lock.json
      - name: Restore or save release Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target/release
          key: hzr-release-rust-linux-x64-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            hzr-release-rust-linux-x64-1.92.0-
      - name: Restore or save verified component build cache
        uses: actions/cache@v4
        with:
          path: target/hzr-component-cache
          key: hzr-components-linux-x64-${{ hashFiles('engines.lock.toml', 'patches/grepai/**', 'patches/icm/**', 'fork-core/CURRENT_ENGINE_V1.tsv', 'fork-core/rtk/Cargo.lock', 'scripts/build-bundle.sh') }}
          restore-keys: |
            hzr-components-linux-x64-
      - run: scripts/complete-gate.sh --bundle "$RUNNER_TEMP/hzr-dist"
      - run: scripts/package-release.sh "$RUNNER_TEMP/hzr-dist" "$RUNNER_TEMP/hzr-release"
      - name: Smoke-install the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "hzr-cli"))')"
          scripts/smoke-install.sh \
            "$RUNNER_TEMP/hzr-release/hzr-v${version}-linux-x64.tar.gz" \
            "$RUNNER_TEMP/hzr-release/SHA256SUMS"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --workspace --all-targets --all-features

  caveman-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: integrations/caveman-code/package-lock.json
      - run: npm ci --prefix integrations/caveman-code
      - run: node --test integrations/caveman-code/bridge.test.mjs
      - run: npm audit --omit=dev --audit-level=high --prefix integrations/caveman-code
      - run: node --check integrations/caveman-code/bridge.mjs

  visualizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
        working-directory: visualizer
      - run: bun test
        working-directory: visualizer
      - run: bun run typecheck
        working-directory: visualizer
      - run: bun run build
        working-directory: visualizer

  grepai-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.2
          # grepai is cloned after setup; caching cannot inspect its go.sum yet.
          cache: false
      - run: git clone --filter=blob:none https://github.com/yoanbernabeu/grepai /tmp/hzr-grepai
      - run: git -C /tmp/hzr-grepai checkout --detach 65c345ca32122c17a39a5bbec2780c2eea773a12
      - run: git -C /tmp/hzr-grepai apply --check "$GITHUB_WORKSPACE/patches/grepai/0.35.0-disable-worktree-discovery.patch"
      - run: git -C /tmp/hzr-grepai apply "$GITHUB_WORKSPACE/patches/grepai/0.35.0-disable-worktree-discovery.patch"
      - run: go test ./cli
        working-directory: /tmp/hzr-grepai
