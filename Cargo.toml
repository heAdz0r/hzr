[workspace]
members = [
    "crates/hzr-agent",
    "crates/hzr-cli",
    "crates/hzr-codec",
    "crates/hzr-context",
    "crates/hzr-core",
    "crates/hzr-daemon",
    "crates/hzr-engine-contract",
    "crates/hzr-exec",
    "crates/hzr-index",
    "crates/hzr-memory",
    "crates/hzr-protocol",
]
resolver = "2"
exclude = ["fork-core/rtk"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/heAdz0r/hzr"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = "0.8.4"
bytes = "1.10.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
directories = "6.0.0"
fs2 = "0.4.3"
hex = "0.4.3"
hzr-engine-contract = { path = "crates/hzr-engine-contract" }
http = "1.3.1"
regex = "1.11.1"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.36.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
toml = "0.8.23"
toml_edit = "0.22.27"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["catch-panic", "fs", "limit", "request-id", "set-header", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.29", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
