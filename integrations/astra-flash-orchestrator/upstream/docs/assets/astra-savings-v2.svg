<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Astra Flash Orchestrator measured efficiency</title>
  <desc id="desc">Keep Astra focused on decisions and use DeepSeek V4.1 Flash for implementation. A field benchmark measured 98.9 percent less Astra input per one thousand implementation and test lines.</desc>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="#f7f7f5" stroke="#e4e4df"/>

  <text x="72" y="78" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">ASTRA FLASH ORCHESTRATOR</text>
  <text x="1128" y="78" fill="#666663" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">Measured field benchmark</text>
  <line x1="72" y1="104" x2="1128" y2="104" stroke="#ddddda"/>

  <text x="72" y="158" fill="#14825f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">ASTRA DECIDES. DEEPSEEK V4.1 FLASH BUILDS.</text>
  <text x="72" y="211" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Keep Astra on the decisions.</text>
  <text x="72" y="261" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Give Flash the workload.</text>

  <text x="860" y="211" fill="#14825f" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" text-anchor="middle">98.9%</text>
  <text x="860" y="244" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">less Astra input</text>
  <text x="860" y="269" fill="#666663" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">per 1K implementation lines</text>

  <line x1="72" y1="302" x2="1128" y2="302" stroke="#ddddda"/>

  <rect x="72" y="334" width="508" height="194" rx="16" fill="#ffffff" stroke="#ddddda"/>
  <text x="98" y="372" fill="#666663" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.7">ALL-ASTRA WORKFLOW</text>
  <text x="98" y="424" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">8.56M</text>
  <text x="98" y="450" fill="#666663" font-family="Arial, Helvetica, sans-serif" font-size="14">Astra plans and implements</text>
  <line x1="98" y1="474" x2="554" y2="474" stroke="#ececea"/>
  <text x="98" y="505" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">$11.32 / 1K lines</text>
  <text x="554" y="505" fill="#777773" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">Astra input</text>

  <rect x="608" y="334" width="520" height="194" rx="16" fill="#eaf6f1" stroke="#a9d8c7"/>
  <text x="634" y="372" fill="#14825f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.7">ASTRA + DEEPSEEK V4.1 FLASH</text>
  <rect x="1015" y="351" width="87" height="27" rx="13.5" fill="#14825f"/>
  <text x="1058.5" y="369" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CURRENT</text>
  <text x="634" y="424" fill="#14825f" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">95.9K</text>
  <text x="634" y="450" fill="#4f7165" font-family="Arial, Helvetica, sans-serif" font-size="14">Astra decides and reviews. Flash builds.</text>
  <line x1="634" y1="474" x2="1102" y2="474" stroke="#c9e3da"/>
  <text x="634" y="505" fill="#14825f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">$0.26-$0.34 / 1K lines</text>
  <text x="1102" y="505" fill="#4f7165" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">Astra + Flash input</text>

  <text x="72" y="570" fill="#777773" font-family="Arial, Helvetica, sans-serif" font-size="13">One measured field build. API-equivalent estimates, not guaranteed subscription savings.</text>
  <text x="1128" y="570" fill="#777773" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end">See docs/BENCHMARK.md</text>
</svg>
